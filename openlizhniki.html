<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Открытый турнир Лужников | Сергей Тихонов</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-family: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --color-text-secondary: rgb(136, 139, 144);
            --color-text-primary: rgba(0, 0, 0, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Hide scrollbars for body, let iframe scroll */
            font-family: var(--font-family);
            background-color: #FFFFFF;
        }

        /* Fullscreen Iframe */
        .site-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Floating Nav Tabs Dock */
        .navigation_tabs {
            display: inline-flex;
            padding: 2px;
            justify-content: center;
            align-items: center;
            gap: 2px;
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .navigation_tabs:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 100px;
            background: rgba(255,255,255,.68);
            box-shadow: 0 2px 32px 0 rgba(0,0,0,.16);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            z-index: -1;
        }

        .navigation_tabs .nav_item_container {
            display: flex;
        }

        .navigation_tabs .nav_item {
            display: flex;
            width: 51px;
            height: 51px;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1/1;
            color: var(--color-text-secondary);
            transition: background-color 0.25s, color 0.25s;
            border-radius: 50%;
        }

        .navigation_tabs .nav_item:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--color-text-primary);
        }

        .profile_pic {
            height: 1.5em;
            width: 1.5em;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Floating Bottom Dock Navigation -->
    <nav class="navigation_tabs">
        <div class="nav_item_container">
            <a class="nav_item" title="На главную" href="index.html">
                <img alt="Сергей Тихонов" class="profile_pic" src="img/profile_pic.png"/>
            </a>
        </div>
        <div class="nav_item_container">
            <a class="nav_item" title="Работы" href="index.html#work">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </a>
        </div>
        <div class="nav_item_container">
            <a class="nav_item" title="Telegram" href="https://t.me/tikhonoxx" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </a>
        </div>
    </nav>

    <!-- Live Embedded Website Frame -->
    <iframe class="site-frame" src="https://open.luzhniki.ru/" title="Открытый турнир Лужников"></iframe>

</body>
</html>
