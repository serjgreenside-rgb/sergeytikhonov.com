            align-items: center;
            gap: 2px;
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .navigation_tabs:before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 100px;
            background: rgba(255,255,255,.68);
            box-shadow: 0 2px 32px 0 rgba(0,0,0,.16);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            z-index: -1;
        }

        .navigation_tabs .nav_item_container {
            display: flex;
        }

        .navigation_tabs .nav_item {
            display: flex;
            width: 51px;
            height: 51px;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1/1;
            color: var(--color-text-secondary);
            transition: background-color 0.25s, color 0.25s;
            border-radius: 50%;
        }

        .navigation_tabs .nav_item:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--color-text-primary);
        }

        .profile_pic {
            height: 1.5em;
            width: 1.5em;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Gallery Grid Layout (Masonry style using CSS Column Layout) */
        .gallery_grid {
            column-count: 2;
            column-gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .gallery_item {
            break-inside: avoid;
            margin-bottom: 20px;
            border-radius: 16px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.03);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .gallery_item:hover {
            transform: scale(1.02);
        }

        .gallery_item video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
            transform: translate3d(0, 0, 0);
        }

        /* Lightbox Popup Modal */
        .lightbox_modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(251, 251, 251, 0.95);
            opacity: 0;
            transition: opacity 0.3s ease;
            justify-content: center;
            align-items: center;
        }

        .lightbox_modal.active {
            display: flex;
            opacity: 1;
        }

        .lightbox_content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .lightbox_close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: var(--color-text-secondary);
            font-size: 40px;
            font-weight: 300;
            transition: color 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .lightbox_close:hover {
            color: var(--color-text-primary);
        }

        body.lightbox_open {
            overflow: hidden;
        }

        @media (max-width: 950px) {
            .project_article_wrapper {

            }

                font-size: 18px;
            }
            .text_column p {

            }
            .gallery_grid {

            }
            .lightbox_close {
                top: 20px;
                right: 20px;
                font-size: 32px;
            }
        }
    </style>

    <!-- Lightbox Popup Modal -->

    </div>

    <!-- Video Controller Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lightbox = document.getElementById('lightbox');
            const lightboxVideo = document.getElementById('lightbox_video');
            const closeBtn = document.querySelector('.lightbox_close');
            const galleryItems = document.querySelectorAll('.gallery_item');

            // Viewport auto-play logic using Intersection Observer
            const observerOptions = {
                root: null,
                rootMargin: '100px', // Pre-trigger before entering viewport for seamless play
                threshold: 0.1
            };

            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        video.play().catch(err => {});
                    } else {
                        video.pause();
                    }
                });
            }, observerOptions);

            galleryItems.forEach(item => {
                const video = item.querySelector('video');
                if (video) {
                    videoObserver.observe(video);
                }

                // Click event to open video lightbox
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (video) {
                        lightboxVideo.src = video.src;
                        document.body.classList.add('lightbox_open');
                        lightbox.classList.add('active');
                    }
                });
            });

            // Close lightbox logic
            const closeLightbox = () => {
                lightbox.classList.remove('active');
                document.body.classList.remove('lightbox_open');
                setTimeout(() => {
                    lightboxVideo.src = '';
                }, 300);
            };

            closeBtn.addEventListener('click', closeLightbox);
            
            // Close when clicking background outside video
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Close on ESC key press
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            });
        });
    </script>
